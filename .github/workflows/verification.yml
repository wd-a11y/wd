name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest
        run: python -m pip install pytest

      - name: Tests (wd-check et exemple gestion-stock)
        run: python -m pytest

      - name: Traçabilité de l'exemple gestion-stock
        run: python outils/wd-check/wd_check.py exemples/gestion-stock --strict
